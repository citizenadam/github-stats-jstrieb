name: Generate Stats Images

on:
  push:
    branches: [master]
    # Don't re-trigger on the workflow's own generated-file commits
    paths-ignore:
      - 'generated/**'
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout stats repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Generate stats images
        run: python generate_images.py
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          # Exclude "Shell" from the language statistics
          EXCLUDED_LANGS: "shell"
          EXCLUDE_FORKED_REPOS: "true"
          # Don't hang when the GitHub stats API is slow to compute (HTTP 202)
          # https://github.com/orgs/community/discussions/192970
          MAX_RETRIES: 5

      - name: Commit generated images to stats repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add generated/*.svg
          git diff --cached --quiet || git commit -m "Update generated files"
          git push origin HEAD:master

      - name: Push images to profile repo
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: |
          rm -rf /tmp/profile-repo
          git clone --depth 1 \
            "https://x-access-token:${ACCESS_TOKEN}@github.com/citizenadam/citizenadam.git" \
            /tmp/profile-repo
          cp generated/languages.svg generated/overview.svg /tmp/profile-repo/
          cd /tmp/profile-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add languages.svg overview.svg
          git diff --cached --quiet || git commit -m "Update generated stats images"
          git push